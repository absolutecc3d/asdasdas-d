<style>
  body {
    background-color: #000080;
    background-image:
      radial-gradient(#ffffff 1px, transparent 1px),
      radial-gradient(#9999ff 1px, transparent 1px);
    background-size: 40px 40px, 70px 70px;
    background-position: 0 0, 20px 30px;
    color: #ffffff;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  a:link { color: #00ffff; }
  a:visited { color: #ff99ff; }
  a:hover { color: #ffff00; background: #ff0000; }
  h1 {
    font-family: "Times New Roman", Times, serif;
    font-size: 44px;
    color: #ffff00;
    text-shadow: 3px 3px #ff0000;
    margin: 10px 0;
  }
  .box {
    width: 560px;
    max-width: 90%;
    margin: 20px auto;
    background: #c0c0c0;
    color: #000000;
    border: 4px outset #ffffff;
    padding: 18px;
  }
  .box a:link { color: #0000ee; }
  .box a:visited { color: #551a8b; }
  .box a:hover { color: #ffffff; background: #0000ee; }
  .big { font-size: 28px; font-weight: bold; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { visibility: hidden; } }
  .counter {
    display: inline-block;
    background: #000000;
    color: #00ff00;
    font-family: "Courier New", monospace;
    font-size: 20px;
    letter-spacing: 4px;
    padding: 4px 10px;
    border: 3px inset #808080;
  }
  hr.rainbow {
    border: 0;
    height: 6px;
    width: 80%;
    background: linear-gradient(to right, red, orange, yellow, lime, cyan, blue, magenta);
  }
  .small { font-size: 12px; }
  .buttons { margin: 20px auto; width: 640px; max-width: 95%; }
  .b88 {
    display: inline-block;
    width: 88px; height: 31px;
    margin: 3px;
    border: 1px solid #000000;
    box-sizing: border-box;
    font-family: Verdana, Arial, sans-serif;
    font-size: 9px;
    font-weight: bold;
    line-height: 10px;
    text-align: center;
    text-decoration: none;
    vertical-align: middle;
    overflow: hidden;
    image-rendering: pixelated;
  }
  .b88 > span { display: block; padding-top: 5px; }
  a.b88:hover { background: inherit; }
  img.gif { margin: 3px; border: 0; vertical-align: middle; }
  .b1 { background: linear-gradient(#3a7bd5, #0b2a6b); color: #ffffff; text-shadow: 1px 1px #000000; }
  .b2 { background: #ffee00; color: #cc0000; text-shadow: 1px 1px #886600; letter-spacing: 1px; }
  .b3 { background: repeating-linear-gradient(45deg, #222222, #222222 4px, #333333 4px, #333333 8px); color: #00ff66; font-family: "Courier New", monospace; }
  .b4 { background: #cc0000; color: #ffffff; border: 2px outset #ff6666; }
  .b5 { background: #f4f0e0; color: #000000; border: 2px inset #999999; font-family: "Courier New", monospace; }
  .b6 { background: linear-gradient(to right, #ff0000, #ffaa00, #ffff00, #00cc00, #0066ff, #9900cc); color: #ffffff; text-shadow: 1px 1px #000000, -1px -1px #000000; }
